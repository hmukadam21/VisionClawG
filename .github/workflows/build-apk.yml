name: Build Android APK

# Builds the Gemini-direct VisionClaw Android app in the cloud (no computer needed)
# and publishes the APK as a GitHub Release so it can be downloaded straight to the phone.
#
# Needs no secrets: Meta's glasses SDK (DAT 1.0.1) comes from Maven Central.
# The Gemini API key is NOT baked in: it is typed into the app's Settings screen.
#
# Every run (pass or fail) saves its full log as build-log.txt on the "build-logs"
# branch, so the whole execution can be read in one place without the Actions UI.

on:
  push:
    branches: [gemini-direct]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash   # explicit bash = -eo pipefail, so a failure before "| tee" fails the step
        working-directory: samples/CameraAccessAndroid
    steps:
      - name: Check out the code
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Meta's SDK on Maven Central (information only)
        id: token
        run: |
          {
            echo "== SDK availability check (never fails the build)"
            V=$(grep -E '^mwdat *=' gradle/libs.versions.toml | sed -E 's/.*"(.*)".*/\1/')
            echo "app asks for mwdat version: $V"
            echo "-- Maven Central: versions of com.meta.wearable:mwdat-core"
            curl -s https://repo1.maven.org/maven2/com/meta/wearable/mwdat-core/maven-metadata.xml \
              | grep -o '<version>[^<]*</version>' | sed -E 's/<\/?version>//g' | tr '\n' ' '; echo
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://repo1.maven.org/maven2/com/meta/wearable/mwdat-core/$V/mwdat-core-$V.pom")
            echo "Maven Central has mwdat-core $V: HTTP $CODE"
          } 2>&1 | tee -a /tmp/build-log.txt || true

      - name: Create Secrets.kt from the template (placeholders only)
        id: secrets
        run: |
          D=app/src/main/java/com/meta/wearable/dat/externalsampleapps/cameraaccess
          cp "$D/Secrets.kt.example" "$D/Secrets.kt"
          echo "== Secrets.kt created from template" | tee -a /tmp/build-log.txt

      - name: Build the APK
        id: build
        run: |
          chmod +x gradlew
          echo "== gradle assembleDebug" | tee -a /tmp/build-log.txt
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee -a /tmp/build-log.txt

      - name: Rename the APK
        id: rename
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VisionClaw.apk
          ls -l VisionClaw.apk | tee -a /tmp/build-log.txt

      - name: Keep the APK as a build artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-apk
          path: samples/CameraAccessAndroid/VisionClaw.apk

      - name: Publish the APK as the "latest-apk" release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "== publishing release latest-apk"
            gh release delete latest-apk --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
            gh release create latest-apk VisionClaw.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "VisionClaw APK (latest build)" \
              --notes "Built from ${GITHUB_SHA::7} on the gemini-direct branch."
          } 2>&1 | tee -a /tmp/build-log.txt

      - name: Save the full log to the build-logs branch
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          PUSH_TOKEN: ${{ github.token }}
          O_CHECKOUT: ${{ steps.checkout.outcome }}
          O_JAVA: ${{ steps.java.outcome }}
          O_TOKEN: ${{ steps.token.outcome }}
          O_SECRETS: ${{ steps.secrets.outcome }}
          O_BUILD: ${{ steps.build.outcome }}
          O_RENAME: ${{ steps.rename.outcome }}
          O_ARTIFACT: ${{ steps.artifact.outcome }}
          O_RELEASE: ${{ steps.release.outcome }}
        run: |
          REPORT="$RUNNER_TEMP/report.txt"
          {
            echo "run #$GITHUB_RUN_NUMBER  commit ${GITHUB_SHA::7}  $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "steps: checkout=$O_CHECKOUT java=$O_JAVA token=$O_TOKEN secrets=$O_SECRETS build=$O_BUILD rename=$O_RENAME artifact=$O_ARTIFACT release=$O_RELEASE"
            echo "------------------------------------------------------------"
            if [ -f /tmp/build-log.txt ]; then tail -c 3000000 /tmp/build-log.txt; else echo "(no log written)"; fi
          } > "$REPORT"
          LOGDIR="$RUNNER_TEMP/logrepo"
          rm -rf "$LOGDIR" && mkdir -p "$LOGDIR" && cd "$LOGDIR"
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp "$REPORT" build-log.txt
          git add build-log.txt
          git commit -q -m "Build log for run #$GITHUB_RUN_NUMBER (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/build-logs
          echo "log saved to the build-logs branch"
